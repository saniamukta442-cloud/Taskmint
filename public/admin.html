<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TaskMint Admin</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(
          circle at top,
          #172554,
          #020617 65%
        );
      color: white;
      min-height: 100vh;
    }

    .container {
      width: min(1100px, 94%);
      margin: auto;
      padding: 25px 0 50px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
    }

    .logo span {
      color: #22d3ee;
    }

    .logout {
      border: 0;
      padding: 10px 16px;
      border-radius: 10px;
      background: #ef4444;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .login-box {
      max-width: 420px;
      margin: 80px auto;
      padding: 30px;
      border-radius: 20px;
      background: rgba(15, 23, 42, .9);
      border: 1px solid #334155;
      box-shadow: 0 0 30px rgba(34, 211, 238, .12);
    }

    .login-box h1 {
      text-align: center;
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #020617;
      color: white;
      outline: none;
    }

    button {
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #06b6d4;
      color: #001018;
      font-weight: 800;
      font-size: 15px;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      color: #f87171;
    }

    .dashboard {
      display: none;
    }

    .stats {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      padding: 20px;
      border-radius: 16px;
      background: rgba(15, 23, 42, .85);
      border: 1px solid #334155;
    }

    .stat-title {
      color: #94a3b8;
      font-size: 14px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      margin-top: 8px;
    }

    .panel {
      background: rgba(15, 23, 42, .88);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 20px;
      overflow-x: auto;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .refresh {
      padding: 9px 14px;
      border: 0;
      border-radius: 9px;
      background: #22d3ee;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 13px 10px;
      border-bottom: 1px solid #1e293b;
      text-align: left;
      font-size: 14px;
    }

    th {
      color: #67e8f9;
    }

    .amount {
      color: #4ade80;
      font-weight: 800;
    }

    .status {
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
    }

    .pending {
      background: #854d0e;
      color: #fde68a;
    }

    .approved {
      background: #14532d;
      color: #86efac;
    }

    .rejected {
      background: #7f1d1d;
      color: #fca5a5;
    }

    .actions {
      display: flex;
      gap: 7px;
    }

    .approve,
    .reject {
      border: 0;
      padding: 8px 11px;
      border-radius: 8px;
      color: white;
      font-weight: bold;
    }

    .approve {
      background: #16a34a;
    }

    .reject {
      background: #dc2626;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #94a3b8;
    }

    @media (max-width: 700px) {

      .stats {
        grid-template-columns: 1fr;
      }

      .header {
        align-items: flex-start;
      }

      .logo {
        font-size: 22px;
      }

      .container {
        width: 96%;
      }
    }

  </style>

</head>

<body>

<div class="container">

  <!-- LOGIN -->

  <div
    class="login-box"
    id="loginBox"
  >

    <h1>💰 TaskMint Admin</h1>

    <input
      id="email"
      type="email"
      placeholder="Admin email"
    >

    <input
      id="password"
      type="password"
      placeholder="Admin password"
    >

    <button
      class="login-btn"
      onclick="adminLogin()"
    >
      🔐 Login
    </button>

    <div
      class="message"
      id="loginMessage"
    ></div>

  </div>


  <!-- DASHBOARD -->

  <div
    class="dashboard"
    id="dashboard"
  >

    <div class="header">

      <div class="logo">
        💰 <span>TaskMint</span> Admin
      </div>

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

    </div>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">

        <div class="stat-title">
          Total Requests
        </div>

        <div
          class="stat-value"
          id="totalRequests"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-title">
          Pending
        </div>

        <div
          class="stat-value"
          id="pendingRequests"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-title">
          Pending Amount
        </div>

        <div
          class="stat-value"
          id="pendingAmount"
        >
          $0.00
        </div>

      </div>

    </div>


    <!-- WITHDRAWALS -->

    <div class="panel">

      <div class="panel-header">

        <h2>
          Withdrawal Requests
        </h2>

        <button
          class="refresh"
          onclick="loadWithdrawals()"
        >
          🔄 Refresh
        </button>

      </div>


      <table>

        <thead>

          <tr>

            <th>ID</th>
            <th>User</th>
            <th>Email</th>
            <th>Amount</th>
            <th>Method</th>
            <th>Account</th>
            <th>Status</th>
            <th>Date</th>
            <th>Action</th>

          </tr>

        </thead>

        <tbody id="withdrawalTable">

        </tbody>

      </table>

    </div>

  </div>

</div>


<script>

  const ADMIN_TOKEN_KEY =
    "taskmint_admin_token";


  function getToken() {
    return localStorage.getItem(
      ADMIN_TOKEN_KEY
    );
  }


  async function adminLogin() {

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;

    const message =
      document.getElementById(
        "loginMessage"
      );

    message.textContent = "";

    try {

      const r =
        await fetch(
          "/api/admin/login",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              email,
              password
            })
          }
        );

      const data =
        await r.json();

      if (!r.ok || !data.ok) {

        message.textContent =
          data.error ||
          "Login failed.";

        return;
      }

      localStorage.setItem(
        ADMIN_TOKEN_KEY,
        data.token
      );

      showDashboard();

    } catch (e) {

      message.textContent =
        "Server connection failed.";
    }
  }


  function showDashboard() {

    document
      .getElementById("loginBox")
      .style.display = "none";

    document
      .getElementById("dashboard")
      .style.display = "block";

    loadWithdrawals();
  }


  function logout() {

    localStorage.removeItem(
      ADMIN_TOKEN_KEY
    );

    location.reload();
  }


  async function loadWithdrawals() {

    const token =
      getToken();

    if (!token) {
      return;
    }

    try {

      const r =
        await fetch(
          "/api/admin/withdrawals",
          {
            headers: {
              Authorization:
                "Bearer " + token
            }
          }
        );

      const data =
        await r.json();

      if (
        r.status === 401 ||
        r.status === 403
      ) {

        logout();
        return;
      }

      if (!data.ok) {
        alert(
          data.error ||
          "Could not load withdrawals."
        );
        return;
      }

      renderWithdrawals(
        data.items || []
      );

    } catch (e) {

      alert(
        "Could not connect to server."
      );
    }
  }


  function renderWithdrawals(items) {

    const table =
      document.getElementById(
        "withdrawalTable"
      );

    table.innerHTML = "";

    let pending = 0;
    let pendingAmount = 0;

    items.forEach(item => {

      if (item.status === "pending") {

        pending++;

        pendingAmount +=
          Number(item.amount || 0);
      }

      const tr =
        document.createElement("tr");

      const statusClass =
        item.status === "approved"
          ? "approved"
          : item.status === "rejected"
            ? "rejected"
            : "pending";

      const date =
        item.created_at
          ? new Date(
              item.created_at
            ).toLocaleString()
          : "-";

      let actions = "-";

      if (item.status === "pending") {

        actions = `
          <div class="actions">

            <button
              class="approve"
              onclick="approveWithdrawal(${item.id})"
            >
              ✓ Approve
            </button>

            <button
              class="reject"
              onclick="rejectWithdrawal(${item.id})"
            >
              ✕ Reject
            </button>

          </div>
        `;
      }

      tr.innerHTML = `

        <td>#${item.id}</td>

        <td>
          ${escapeHtml(
            item.display_name || "-"
          )}
        </td>

        <td>
          ${escapeHtml(
            item.email || "-"
          )}
        </td>

        <td class="amount">
          $${Number(
            item.amount || 0
          ).toFixed(2)}
        </td>

        <td>
          ${escapeHtml(
            String(
              item.method || "-"
            ).toUpperCase()
          )}
        </td>

        <td>
          ${escapeHtml(
            item.account_number || "-"
          )}
        </td>

        <td>
          <span class="status ${statusClass}">
            ${escapeHtml(
              item.status
            )}
          </span>
        </td>

        <td>
          ${escapeHtml(date)}
        </td>

        <td>
          ${actions}
        </td>

      `;

      table.appendChild(tr);

    });


    if (!items.length) {

      table.innerHTML = `
        <tr>
          <td
            colspan="9"
            class="empty"
          >
            No withdrawal requests found.
          </td>
        </tr>
      `;
    }


    document.getElementById(
      "totalRequests"
    ).textContent = items.length;

    document.getElementById(
      "pendingRequests"
    ).textContent = pending;

    document.getElementById(
      "pendingAmount"
    ).textContent =
      "$" + pendingAmount.toFixed(2);
  }


  async function approveWithdrawal(id) {

    if (
      !confirm(
        "Approve this withdrawal?"
      )
    ) {
      return;
    }

    await processWithdrawal(
      id,
      "approve"
    );
  }


  async function rejectWithdrawal(id) {

    if (
      !confirm(
        "Reject this withdrawal and refund the user's balance?"
      )
    ) {
      return;
    }

    await processWithdrawal(
      id,
      "reject"
    );
  }


  async function processWithdrawal(
    id,
    action
  ) {

    const token =
      getToken();

    try {

      const r =
        await fetch(
          `/api/admin/withdrawals/${id}/${action}`,
          {
            method: "POST",

            headers: {
              Authorization:
                "Bearer " + token
            }
          }
        );

      const data =
        await r.json();

      if (!r.ok || !data.ok) {

        alert(
          data.error ||
          "Action failed."
        );

        return;
      }

      alert(
        data.message ||
        "Done."
      );

      loadWithdrawals();

    } catch (e) {

      alert(
        "Server connection failed."
      );
    }
  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  // Auto login if token exists

  if (getToken()) {
    showDashboard();
  }

</script>

</body>

</html>
